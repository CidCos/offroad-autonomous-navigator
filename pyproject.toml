[project]
name = "offroad-autonomous-navigator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "IvanC", email = "ivancidcos@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "gymnasium>=1.3.0",
    "loguru>=0.7.3",
    "mlflow>=3.15.1",
    "mujoco>=3.11.0",
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
    "wandb>=0.28.1",
]

[project.scripts]
offroad-autonomous-navigator = "offroad_autonomous_navigator:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
mypy_path = "src"
explicit_package_bases = true
files = ["src/offroad_autonomous_navigator", "tests", "experiments"]

[[tool.mypy.overrides]]
module = "mujoco.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
